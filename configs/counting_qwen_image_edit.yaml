# Counting SFT: Fine-tune Qwen-Image-Edit to obey object counts in editing prompts.
#
# Paths use ${oc.env:QFLUX_REPO_ROOT} so the config is portable across machines.
# The train script (scripts/counting/train_counting.sh) sets this automatically.
# For manual use: export QFLUX_REPO_ROOT=/path/to/qwen-image-finetune

model:
  pretrained_model_name_or_path: Qwen/Qwen-Image-Edit
  quantize: false
  lora:
    r: 16
    lora_alpha: 16
    init_lora_weights: "gaussian"
    target_modules: ["to_k", "to_q", "to_v", "to_out.0"]
    pretrained_weight: null
    adapter_name: "lora_edit"

data:
  class_path: qflux.data.dataset.ImageDataset
  init_args:
    dataset_path:
      - ${oc.env:QFLUX_REPO_ROOT}/data/counting/train
    parquet_column_map:
      image: edited_image
      control: original_image
      prompt: prompt
    caption_dropout_rate: 0.05
    prompt_image_dropout_rate: 0.05
    cache_dir: ${cache.cache_dir}
    use_cache: ${cache.use_cache}
    processor:
      class_path: qflux.data.preprocess.ImageProcessor
      init_args:
        process_type: center_crop
        resize_mode: bilinear
        target_size: [512, 512]
        controls_size: [[512, 512]]

  batch_size: 1
  num_workers: 4
  shuffle: true

validation:
  enabled: true
  steps: 250
  max_samples: 4
  seed: 42
  dataset:
    class_path: qflux.data.dataset.ImageDataset
    init_args:
      dataset_path:
        - ${oc.env:QFLUX_REPO_ROOT}/data/counting/val
      parquet_column_map:
        image: edited_image
        control: original_image
        prompt: prompt
      caption_dropout_rate: 0.0
      prompt_image_dropout_rate: 0.0
      processor:
        class_path: qflux.data.preprocess.ImageProcessor
        init_args:
          process_type: center_crop
          resize_mode: bilinear
          target_size: [512, 512]
          controls_size: [[512, 512]]

logging:
  output_dir: ${oc.env:QFLUX_REPO_ROOT}/outputs/counting_lora
  report_to: tensorboard
  tracker_project_name: counting_qwen_image_edit
  tags:
    - counting
    - qwen_image_edit
    - sft
    - lora
  notes: "SFT fine-tuning Qwen-Image-Edit to obey object counts in editing prompts"

optimizer:
  class_path: bitsandbytes.optim.Adam8bit
  init_args:
    lr: 0.0001
    betas: [0.9, 0.999]

lr_scheduler:
  scheduler_type: "cosine"
  warmup_steps: 100
  num_cycles: 0.5
  power: 1.0

train:
  gradient_accumulation_steps: 2
  max_train_steps: 26430  # ~3 epochs (17620 samples / batch 1 / grad_accum 2 * 3)
  checkpointing_steps: 500
  checkpoints_total_limit: 5
  max_grad_norm: 1.0
  mixed_precision: "bf16"
  gradient_checkpointing: true
  low_memory: true

trainer: QwenImageEdit
resume: null

cache:
  devices:
    vae: cuda:0
    text_encoder: cuda:0
  cache_dir: ${logging.output_dir}/cache
  use_cache: true
  prompt_empty_drop_keys:
    - prompt_embeds
    - prompt_embeds_mask

predict:
  devices:
    vae: cuda:0
    text_encoder: cuda:0
    dit: cuda:0
