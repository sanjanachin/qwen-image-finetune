# Counting SFT: Fine-tune Qwen-Image-Edit to obey object counts in editing prompts.
#
# Paths use ${oc.env:QFLUX_REPO_ROOT} so the config is portable across machines.
# The train script (scripts/counting/train_counting.sh) sets this automatically.
# For manual use: export QFLUX_REPO_ROOT=/path/to/qwen-image-finetune

model:
  pretrained_model_name_or_path: Qwen/Qwen-Image-Edit
  quantize: false
  lora:
    r: 16
    lora_alpha: 16
    init_lora_weights: "gaussian"
    target_modules: ["to_k", "to_q", "to_v", "to_out.0"]
    pretrained_weight: null
    adapter_name: "lora_edit"

data:
  class_path: qflux.data.dataset.ImageDataset
  init_args:
    dataset_path:
      - ${oc.env:QFLUX_REPO_ROOT}/data/counting/train
    parquet_column_map:
      image: edited_image
      control: original_image
      prompt: prompt
    caption_dropout_rate: 0.05
    # Disabled: zero-control branches (image_only/both) trained the LoRA to synthesize N
    # objects from prompt alone, which superimposes objects on top of the input scene at
    # inference and is the leading suspect for the persistent overcounting bias in v0-v2.
    prompt_image_dropout_rate: 0.0
    cache_dir: ${cache.cache_dir}
    use_cache: ${cache.use_cache}
    processor:
      class_path: qflux.data.preprocess.ImageProcessor
      init_args:
        # Match native parquet resolution (1024x1024); avoids train/eval resize mismatch vs 512.
        process_type: center_crop
        resize_mode: bilinear
        target_size: [1024, 1024]
        controls_size: [[1024, 1024]]

  # batch 1 + grad_accum 2 keeps effective batch 2 vs prior batch 2; lowers VRAM at 1024^2.
  batch_size: 1
  num_workers: 4
  shuffle: true

validation:
  enabled: true
  steps: 250
  max_samples: 4
  seed: 42
  # Match eval-sweep CFG so val panels reflect actual edit behavior; CFG=1 with
  # strong image conditioning just reconstructs the input and hides issues.
  true_cfg_scale: 4.0
  negative_prompt: " "
  dataset:
    class_path: qflux.data.dataset.ImageDataset
    init_args:
      dataset_path:
        - ${oc.env:QFLUX_REPO_ROOT}/data/counting/val
      parquet_column_map:
        image: edited_image
        control: original_image
        prompt: prompt
      caption_dropout_rate: 0.0
      prompt_image_dropout_rate: 0.0
      cache_dir: ${cache.cache_dir}
      use_cache: ${cache.use_cache}
      processor:
        class_path: qflux.data.preprocess.ImageProcessor
        init_args:
          # Same 1024x1024 as train / parquet native size.
          process_type: center_crop
          resize_mode: bilinear
          target_size: [1024, 1024]
          controls_size: [[1024, 1024]]

logging:
  output_dir: ${oc.env:QFLUX_REPO_ROOT}/outputs/counting_lora
  report_to: tensorboard
  tracker_project_name: counting_qwen_image_edit
  tags:
    - counting
    - qwen_image_edit
    - sft
    - lora
  notes: "SFT fine-tuning Qwen-Image-Edit to obey object counts in editing prompts"

optimizer:
  class_path: bitsandbytes.optim.Adam8bit
  init_args:
    # v3 (lr=5e-5, max_steps=80460) drifted past its peak around step ~1500 and developed a
    # high-count overcount bias. Lowered to 1e-5 to slow drift and let cosine decay actually
    # shrink the LR over the planned run length (vs. v3 where LR stayed near peak the whole time).
    lr: 0.00001
    betas: [0.9, 0.999]

lr_scheduler:
  scheduler_type: "cosine"
  warmup_steps: 500
  num_cycles: 0.5
  power: 1.0

train:
  gradient_accumulation_steps: 2
  # ~1.25 epochs: 16091 samples / (batch_size 1 * grad_accum 2) ≈ 8045 steps/epoch.
  # Sized so the cosine schedule actually decays (vs. v3's 80460 which kept LR near peak).
  max_train_steps: 10000
  checkpointing_steps: 500
  checkpoints_total_limit: 5
  max_grad_norm: 1.0
  mixed_precision: "bf16"
  gradient_checkpointing: true
  low_memory: true

trainer: QwenImageEdit
resume: null

cache:
  devices:
    vae: cuda:0
    text_encoder: cuda:0
  cache_dir: ${logging.output_dir}/cache
  use_cache: true
  prompt_empty_drop_keys:
    - empty_prompt_embeds
    - empty_prompt_embeds_mask

predict:
  devices:
    vae: cuda:0
    text_encoder: cuda:0
    dit: cuda:0
